<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f5f7" />
<meta name="description" content="研途 · AI 保研服务平台可交互演示。15 个画面，从需求建档到服务交付。" />
<title>可交互演示 · 研途</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/demo.css" />
</head>
<body class="demo-body">

<!-- 顶栏 -->
<header class="dnav">
  <a class="dback" href="index.html">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    <span>返回</span>
  </a>
  <div class="dtitle">可交互演示<small>研途 · AI 保研服务平台</small></div>
  <div class="dright">
    <button class="dbtn" id="btnTheme" type="button" title="白天 / 黑夜">
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 13.2A8.5 8.5 0 1 1 10.8 3a7 7 0 0 0 10.2 10.2Z"/></svg>
    </button>
    <button class="dbtn txt" id="btnJump" type="button">场景</button>
  </div>
</header>

<!-- 主体：手机 + 右侧说明 -->
<div class="dwrap">
  <div class="dstage">
    <div class="dphone">
      <iframe id="frame" src="app.html?embed=1#/home" title="研途界面演示"></iframe>
    </div>
    <div class="dhint">
      <span>直接在手机上点 · 也可以滑动</span>
    </div>
  </div>

  <aside class="dside">
    <div class="side-card">
      <h3>这一步在讲什么</h3>
      <div class="side-now" id="sideNow">首页 · 未建档态</div>
      <p class="side-p" id="sideP">没建档时，不给任何"看起来像已经匹配好了"的内容，只给定位入口。</p>
    </div>

    <div class="side-card">
      <div class="side-label">全部画面</div>
      <div class="side-list" id="sideList"></div>
    </div>

    <div class="side-card side-tip">
      <div class="side-label">试试这些</div>
      <ul>
        <li>建档第 2 步点「填入 20 / 10」，会被拦住</li>
        <li>看陈老师：3/3 满额，主按钮是灰的</li>
        <li>方案页点「服务者已改价」，v1 确认立刻失效</li>
        <li>付款页面名称额被占，不让付</li>
      </ul>
    </div>
  </aside>
</div>

<!-- 场景抽屉 -->
<div class="dsheet" id="sheet">
  <div class="dsheet-in">
    <div class="dsheet-head">
      <h4>跳到任意画面</h4>
      <button id="sheetClose" type="button">关闭</button>
    </div>
    <div class="dsheet-body" id="sheetBody"></div>
  </div>
</div>

<script src="assets/demo.js"></script>
</body>
</html>
